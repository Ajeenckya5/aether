name: Android sideload APK

on:
  push:
    branches: [master]
    paths:
      - "native/android/**"
      - "native/ios/AetherBand/AetherBand/WebBluetoothPolyfill.js"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-sideload
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble sideload APK
        working-directory: native/android/AetherBand
        run: gradle assembleRelease --no-daemon
      - name: Name the sideload file
        run: |
          mkdir -p dist
          cp native/android/AetherBand/app/build/outputs/apk/release/app-release.apk dist/Aether.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-sideload
          name: Aether Android (sideload)
          body: |
            Sideload APK. **Not on Google Play.**

            1. On the Android phone, download `Aether.apk` from this release.
            2. Allow install from the browser / Files if Android asks.
            3. Open Aether. Allow Bluetooth (and notifications so the overnight keep-alive can stay up).
            4. Disconnect the official WHOOP app, then tap Connect WHOOP.

            Public Heart Rate GATT only. Aether sleep needs the app left connected overnight. iPhone still uses the Xcode app or Bluefy — this APK is Android.
          files: dist/Aether.apk
          fail_on_unmatched_files: true
          make_latest: true
          overwrite_files: true
