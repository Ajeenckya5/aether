name: Android release APK

on:
  push:
    branches: [master]
    paths:
      - "native/android/**"
      - "native/ios/AetherBand/AetherBand/WebBluetoothPolyfill.js"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Decode the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aether-release.p12"
      - name: Assemble the signed release APK
        working-directory: native/android/AetherBand
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/aether-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Name the Obtainium asset and write SHA-256
        run: |
          mkdir -p dist
          cp native/android/AetherBand/app/build/outputs/apk/release/app-release.apk dist/aether.apk
          shasum -a 256 dist/aether.apk > dist/SHA256SUMS
          cat dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Aether 1.0.0
          body: |
            Signed Android sideload build. **Not on Google Play.**

            The asset name `aether.apk` stays the same so Obtainium can track this GitHub repo. `SHA256SUMS` is the checksum for that file.

            The older `android-sideload` release is unchanged.

            1. On the Android phone, download `aether.apk` from this release.
            2. Allow install from the browser / Files if Android asks.
            3. Open Aether. Allow Bluetooth (and notifications so the overnight keep-alive can stay up).
            4. Disconnect the official WHOOP app, then tap Connect WHOOP.

            Public Heart Rate GATT only. Aether sleep needs the app left connected overnight. iPhone still uses the Xcode app or Bluefy — this APK is Android.
          files: |
            dist/aether.apk
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          make_latest: true
          overwrite_files: true
