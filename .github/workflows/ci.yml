name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx eslint src e2e playwright.config.ts --max-warnings 0
      - run: npx tsc --noEmit
      - run: npm test
      - run: node personas/check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: persona-report
          path: personas/report.html

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/build-pages.mjs
      - run: npx playwright test
      - run: node personas/replay.mjs
        env:
          PERSONA_COUNT: "300"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persona-replay
          path: personas/report.html

