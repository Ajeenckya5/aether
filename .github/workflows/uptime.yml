name: Uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check the live site
        id: ping
        continue-on-error: true
        run: curl --fail --silent --show-error --max-time 20 -o /dev/null https://ajeenckya5.github.io/aether/
      - name: Open an issue when the site is down
        if: steps.ping.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Site unreachable: ajeenckya5.github.io/aether";
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "uptime",
            });
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ["uptime"],
                body: "The scheduled check could not load the GitHub Pages site.",
              });
            }
      - name: Close uptime issues when the site is back
        if: steps.ping.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "uptime",
            });
            for (const issue of issues.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }
